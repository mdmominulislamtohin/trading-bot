          cat > docs/ARCHITECTURE.md <<'ARCH'
# Architecture Overview

This document describes the high level architecture of the Trading Bot platform:

- services/web: Monolithic web UI (PHP) for browser users (legacy pages).
- services/api: JSON API for SPA and mobile clients.
- services/worker: background workers (pollers, processors, reconcilers).
- packages/exchanges: Exchange adapters (Bitget, Binance, etc.) implementing a common interface.
- packages/core: Core domain logic (repositories, services, models).
- packages/utils: Shared utilities (bignum, crypto, env helpers).
- infra: Docker and deployment artifacts.

Data flow:
1. Worker poller fetches deposits from exchange adapters, stores raw deposit rows.
2. Processor consumes deposits and writes ledger_transactions (amount_raw) and updates wallet balances.
3. API serves user wallets and ledger via secure endpoints.
ARCH

