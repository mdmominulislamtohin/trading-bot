name: Create Monorepo Skeleton

# Manually triggered; run this once after you commit the workflow file to main
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-skeleton:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create skeleton branch and files
        run: |
          set -e
          BRANCH="feature/monorepo-skeleton"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # create branch from main
          git fetch origin main
          git checkout -b "$BRANCH" || git checkout "$BRANCH"

          # create directories
          mkdir -p .github/workflows infra services/web/public services/web/src services/api/public services/api/src services/worker/src packages/core/src packages/core/src/Models packages/core/src/Repositories packages/exchanges/src packages/utils/src scripts docs tests/unit migrations

          # Add CI workflow (minimal)
          cat > .github/workflows/ci.yml <<'YML'
name: CI
on:
  push:
    branches: [ main, feature/monorepo-skeleton ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Validate composer
        run: |
          php -v
          composer --version || true
      - name: Install dependencies (if any)
        run: |
          if [ -f services/api/composer.json ]; then (cd services/api && composer install --no-interaction --no-scripts); fi
      - name: Run php -v
        run: php -v
      - name: Run basic tests (placeholder)
        run: |
          echo "No tests configured yet"
YML

