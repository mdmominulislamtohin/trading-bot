          # scripts and docs
          cat > scripts/migrate.sh <<'MIG'
#!/usr/bin/env bash
set -e
ROOT=$(dirname "$0")/..
echo "Running migrations..."
for f in $(ls $ROOT/migrations/*.sql | sort); do
  echo "Applying $f"
  mysql -u "$DB_USER" -p"$DB_PASS" -h "$DB_HOST" "$DB_NAME" < "$f"
done
echo "Done."
MIG
