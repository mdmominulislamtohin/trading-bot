name: Create Monorepo Skeleton

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-skeleton:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create skeleton branch and files
        run: |
          set -euo pipefail

          BRANCH="feature/monorepo-skeleton"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Create branch from main if exists
          git fetch origin main || true
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            git checkout -B "$BRANCH" origin/main
          else
            git checkout -B "$BRANCH"
          fi

          # Create directories
          mkdir -p .github/workflows infra services/web/public services/web/src services/api/public services/api/src services/worker/src packages/core/src packages/core/src/Models packages/core/src/Repositories packages/exchanges/src packages/utils/src scripts docs tests/unit migrations

          # Write a minimal CI workflow
          cat > .github/workflows/ci.yml <<'CIY'
name: CI
on:
  push:
    branches: [ main, feature/monorepo-skeleton ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Basic info
        run: |
          php -v
          composer --version || true
      - name: Placeholder tests
        run: |
          echo "No tests configured"
CIY

          # Minimal infra files
          cat > infra/Dockerfile.web <<'DOCKWEB'
# Minimal Dockerfile for web frontend
FROM php:8.1-fpm
WORKDIR /var/www/html
RUN apt-get update && apt-get install -y git unzip libzip-dev libonig-dev zlib1g-dev libxml2-dev
RUN docker-php-ext-install pdo pdo_mysql mbstring zip xml
COPY services/web /var/www/html
DOCKWEB

          cat > infra/Dockerfile.worker <<'DOCKW'
# Minimal Dockerfile for worker
FROM php:8.1-cli
WORKDIR /app
RUN apt-get update && apt-get install -y git unzip
COPY services/worker /app
CMD ["php", "src/Worker.php"]
DOCKW

          cat > infra/docker-compose.yml <<'DCOMPOSE'
version: '3.8'
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: trading
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      - db
  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.worker
    depends_on:
      - db
volumes:
  db_data:
DCOMPOSE

          # Basic migrations placeholder
          cat > migrations/0001_init.sql <<'SQL'
-- Initial schema placeholders
CREATE TABLE IF NOT EXISTS users (
  id BIGINT AUTO_INCREMENT PRIMARY KEY,
  email VARCHAR(255) UNIQUE,
  password_hash VARCHAR(255),
  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4;
SQL

          # Web placeholder
          cat > services/web/public/index.php <<'PHPWEB'
<?php
// services/web/public/index.php - placeholder landing
?><!doctype html>
<html><head><meta charset="utf-8"><title>Trading Bot - Web</title></head><body>
<h1>Trading Bot - Web Service (Skeleton)</h1>
<p>Use services/api for JSON endpoints.</p>
</body></html>
PHPWEB

          # API placeholder
          cat > services/api/public/index.php <<'APIPUB'
<?php
header('Content-Type: application/json');
$path = $_GET['path'] ?? '';
if ($path === 'health') {
  echo json_encode(['status'=>'ok','service'=>'api']);
  exit;
}
http_response_code(404);
echo json_encode(['status'=>'error','message'=>'Not found']);
APIPUB

          # Worker placeholder
          cat > services/worker/src/Worker.php <<'WK'
<?php
// services/worker/src/Worker.php - simple worker skeleton
echo "Worker started\n";
WK

          # Packages placeholders
          mkdir -p packages/core/src packages/exchanges/src packages/utils/src
          cat > packages/exchanges/src/ExchangeInterface.php <<'EI'
<?php
namespace Packages\Exchanges;

interface ExchangeInterface {
    public function getAccountAssets(array $credentials): array;
    public function fetchTicker(string $symbol): array;
    public function fetchCandles(string $symbol, string $interval, int $limit): array;
}
EI

          cat > packages/utils/src/Bignum.php <<'BN'
<?php
namespace Packages\Utils;

class Bignum {
  public static function toWei(string $amount, int $decimals = 18): string {
    if (!extension_loaded('bcmath')) throw new \Exception('bcmath required');
    $a = str_replace(',', '', trim($amount));
    if ($a === '') return '0';
    $factor = bcpow('10', (string)$decimals, 0);
    return bcmul($a, $factor, 0);
  }
}
BN

          # docs, scripts, env example
          cat > docs/ARCHITECTURE.md <<'ARCH'
# Architecture Overview
services/web, services/api, services/worker, packages/exchanges, packages/core, packages/utils
ARCH

          cat > .env.example <<'ENV'
APP_ENV=development
DB_HOST=127.0.0.1
DB_NAME=trading
DB_USER=root
DB_PASS=root
ENV

          # Commit & push
          git add .
          git commit -m "chore(monorepo): add minimal monorepo skeleton" || true
          git push -u origin "$BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
